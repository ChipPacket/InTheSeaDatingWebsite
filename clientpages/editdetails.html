     -->
    <div class="container">
        <div class="row">
            <div class="col-6">
                <h1>Your details...</h1>
            </div>
            <div class="col-6">
                <button type="button" class="btn" id="editDetails">Edit Details</button>
            </div>
        </div>
    </div>
    <br>
    <div class="container">
        <form id="userDetailsForm">
            <!--
                    PUBLIC DETAILS
            -->
            <fieldset id="fieldset1" disabled>
                <br>
                <legend>
                    <h2> Public Details: </h2>
                </legend>
                <div class="form-group-inline">
                    <div class="row">
                        <div class="col-1"></div>
                        <div class="col-5">
                            <label for="firstName">First Name</label>
                            <input type="text" class="form-control" id="firstName" placeholder="First Name" autocapitalize="sentences">
                            <label for="lastName">Last Name</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Last Name" autocapitalize="sentences">
                        </div>
                        <div class="col-5">
                            <label for="profilePicture">Profile Picture</label>
                            <input type="url" class="form-control" id="profilePicture" placeholder="Enter Image Link">
                        </div>
                    </div>
                </div>
                <br>
                <div class="form-group-inline">
                    <div class="row">
                        <div class="col-1"></div>
                        <div class="col-5">
                            <label for="ownGender">My Gender</label>
                            <select class="form-control" id="ownGender">
                                <option>Choose one...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-5">
                            <label for="attractedGender">I am Attracted To...</label>
                            <select class="form-control" id="attractedGender">
                                <option>Choose one...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                </div>
                <br>
                <div class="form-group-inline">
                    <div class="row">
                        <div class="col-1"></div>
                        <div class="col-10">
                            <label for="profileContent">Profile Content</label>
                            <textarea class="form-control" id="profileContent" rows="5" maxlength="500"></textarea>
                        </div>
                    </div>
                </div>
                <br>
                <div class="form-group-inline">
                    <div class="row">
                        <div class="col-1"></div>
                        <div class="col-3">
                            <label for="questionOne">Question One</label>
                            <select class="form-control" id="questionOne">
                                <option>Choose one...</option>
                                <option value="What animal describes you best?">What animal describes you best?</option>
                                <option value="What is your love language?">What is your love language?</option>
                                <option value="What is your favourite colour?">What is your favourite colour?</option>
                                <option value="What is your recent obsession?">What is your recent obsession?</option>
                                <option value="What is your ideal first date?">What is your ideal first date?</option>
                                <option value="What is your relationship dealbreaker?">What is your relationship dealbreaker?</option>
                            </select>
                            <label for="answerOne">Answer One</label>
                            <textarea class="form-control" id="answerOne" rows="5" maxlength="200"></textarea>
                        </div>
                        <div class="col-4">
                            <label for="questionTwo">Question Two</label>
                            <select class="form-control" id="questionTwo">
                                <option>Choose one...</option>
                                <option value="What animal describes you best?">What animal describes you best?</option>
                                <option value="What is your love language?">What is your love language?</option>
                                <option value="What is your favourite colour?">What is your favourite colour?</option>
                                <option value="What is your recent obsession?">What is your recent obsession?</option>
                                <option value="What is your ideal first date?">What is your ideal first date?</option>
                                <option value="What is your relationship dealbreaker?">What is your relationship dealbreaker?</option>
                            </select>
                            <label for="answerTwo">Answer</label>
                            <textarea class="form-control" id="answerTwo" rows="5" maxlength="200"></textarea>
                        </div>
                        <div class="col-3">
                            <label for="questionThree">Question Three</label>
                            <select class="form-control" id="questionThree">
                                <option>Choose one...</option>
                                <option value="What animal describes you best?">What animal describes you best?</option>
                                <option value="What is your love language?">What is your love language?</option>
                                <option value="What is your favourite colour?">What is your favourite colour?</option>
                                <option value="What is your recent obsession?">What is your recent obsession?</option>
                                <option value="What is your ideal first date?">What is your ideal first date?</option>
                                <option value="What is your relationship dealbreaker?">What is your relationship dealbreaker?</option>
                            </select>
                            <label for="answerThree">Answer</label>
                            <textarea class="form-control" id="answerThree" rows="5" maxlength="200"></textarea>
                        </div>
                    </div>
                </div>
            </fieldset>
            <br><br>
            <!--
                    PRIVATE DETAILS
             -->
            <fieldset id="fieldset2" disabled>
                <legend>
                    <h2>Private Details: </h2>
                </legend>
                <div class="form-group-inline">
                    <div class="row">
                        <div class="col-1"></div>
                        <div class="col-5">
                            <!-- email -->
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" aria-describedby="email" placeholder="Enter email">
                        </div>
                        <div class="col-5">
                            <!-- password -->
                            <label for="password">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Password">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="show_password">
                                <label class="form-check-label" for="show_password">Show Password?</label>
                            </div> 
                        </div> 
                    </div>
                    <div class="row">
                        <div class="col-1"></div>
                        <div class="col-3">
                            <!-- birthday UNEDITABLE-->
                            <label for="birthday">Birthday</label>
                            <input type="date" id="birthday" class="form-control" max="2008-04-10" disabled>
                        </div>
                    </div><br><br><br>
                    <br>
                    <div class="row">
                        <div class="col-1"></div>
                        <div class="col-3">
                            <button type="submit" id="delete" class="btn btn-danger">DELETE ACCOUNT</button>
                        </div>
                        <div class="col-4"></div>
                        <div class="col-3">
                            <button type="submit" id="submit" class="btn">Submit Changes</button>
                        </div>
                        <div class="col-1"></div>
                    </div><br><br><br>
                </div>
             </fieldset>
        </form>
    </div>
