	<div class="main" style="padding: 20px 0px 20px 50px;">
		<h2>New Post</h2>
		<p>Use the form below to add a new blog post. Please make sure to fill out all fields before submitting.</p>

	<div id="NP">
		<form action="" id="newPost">
			<label for="editor">Editor (your name):</label><br>
			<input type="text" id="editor" name="editor"><br>
			
			<label for="title">Title:</label><br>
			<input type="text" id="title" name="title"><br>
			
			<label for="author">Author(s):</label><br>
			<input type="text" id="author" name="author"><br>
			
			<label for="content">Content:</label><br>
			<textarea id = "content" name="content" rows="10" cols="100"></textarea><br>

            <label for="photo">Photo URL:</label><br>
            <input type="text" id="photo" name="photo"><br>
			<input type="submit" value="Submit">
		</form>
