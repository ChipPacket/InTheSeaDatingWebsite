<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Posts</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://use.fontawesome.com/fe459689b4.js"></script>
	 <link rel="stylesheet" type="text/css" href="/newPost.css" />
</head>
<body>
	<!-- admin link back to homepage nav bar type sitch -->
	<a href="editBlogPost.html"><button>ADMIN HOME</button></a>
	<div id="NP">
		<h2>New Post</h2>
		<!-- if they click new post-->
		<!-- they will need to fill out this form -->
		
		<form action="" id="newPost">
			
			<label for="title">Title:</label><br>
			<textarea type="text" id="title" name="title" rows="1" cols="100"></textarea><br>
			
			<label for="author">Author(s):</label><br>
			<textarea type="text" id="author" name="author" rows="1" cols="100"></textarea><br>

			<label for="photo">Photo:</label><br>
			<textarea id = "photo" name="photo" rows="1" cols="100"></textarea><br>

			<label for="content">Content:</label><br>
			<textarea id = "content" name="content" rows="10" cols="100"></textarea><br>

			<input type="submit" value="Submit">
		</form>
	</div>	
	<script src="newPost.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
