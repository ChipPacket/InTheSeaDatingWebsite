<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>API Test</title>

<style>
    body {
        background: salmon;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .box {
        padding: 25px;
	padding-right: 50px;
        border-radius: 12px;
        width: 360px;
	background: darksalmon;
	text-align: center;
    }

    input, button {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border-radius: 6px;
        border: none;
    }

    button {
        background: black;
        cursor: pointer;
        font-weight: bold;
	color: white;
    }

    pre {
        margin-top: 15px;
        white-space: pre-wrap;
        font-size: 12px;
    }
</style>
</head>
<body>

<div class="box">
    <h2>Test</h2>

    <input id="name1" placeholder="name">
    <input id="dob1" placeholder="date">

    <input id="name2" placeholder="name">
    <input id="dob2" placeholder="date">

    <input id="name3" placeholder="name">
    <input id="dob3" placeholder="date">

    <button onclick="checkMatch()">Check Match</button>

    <pre id="output"></pre>
</div>

<script>

async function checkMatch() {
    const name1 = document.getElementById("name1").value;
    const dob1 = document.getElementById("dob1").value;
    const name2 = document.getElementById("name2").value;
    const dob2 = document.getElementById("dob2").value;
    const name3 = document.getElementById("name3").value;
    const dob3 = document.getElementById("dob3").value;

    if (!name1 || !dob1 || !name2 || !dob2) {
        document.getElementById("output").textContent =
            "Please fill in all fields.";
        return;
    }

    const params = encodeURIComponent(
        `name=${name1}&dob=${dob1}&name1=${name2}&dob1=${dob2}&name2=${name3}&dob2=${dob3}&sort=L&NC=C&ryr=2026&details=N`
    );

    const url = `https://starlovematch.p.rapidapi.com/api/?birthdetails=${params}`;

    try {
        const response = await fetch(url, {
            method: "GET",
            headers: {
                "x-rapidapi-key": "ff9205a93bmsh388aaac8adccb5bp128ac4jsn2cd2d4f5ee6b",
                "x-rapidapi-host": "starlovematch.p.rapidapi.com"
            }
        });

        const text = await response.text();
        document.getElementById("output").textContent = text;

    } catch (err) {
        document.getElementById("output").textContent =
            "Request failed.";
        console.error(err);
    }
}
</script>

</body>
</html>
